<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dashboards · martcharts</title>
    <meta name="description" content="Four worked dashboards: sales, commercial, client health and regulatory, each read top to bottom." />
    <link rel="stylesheet" href="/demo/site-nav.css" />
    <link rel="stylesheet" href="/demo/site-look.css" />
    <link rel="stylesheet" href="/demo/site-page.css" />
    <script src="/site-look.js"></script>
    <style>
      .board-tabs { display: flex; gap: 2px; margin: 0 0 13px; padding: 2px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 8%, transparent); width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
      .board-tabs::-webkit-scrollbar { display: none; }
      .board-tabs button { flex: none; appearance: none; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font: inherit; font-size: 14px; min-height: 34px; padding: 0 13px; cursor: pointer; }
      .board-tabs button[aria-selected="true"] { background: var(--field); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14), 0 0 0 0.5px var(--line); }
      .board-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      header.page { margin-top: 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="site-bar">
        <nav class="site-nav" aria-label="Pages">
          <a href="./index.html" title="What martcharts is, and where to start">Home</a>
          <a href="./dashboards.html" aria-current="page" title="Four worked dashboards: sales, commercial, client health and regulatory">Dashboards</a>
          <a href="./editor.html" title="A chart from a table, without writing JSON; or edit any chart's JSON directly">Editor</a>
          <a href="./composer.html" title="Lay saved charts out into a dashboard">Composer</a>
          <a href="./catalog/index.html" title="Every chart type, what it needs, and a spec to copy">Catalog</a>
          <a href="./examples/drop-in.html" title="Every way to put a chart on a page">Embed</a>
          <a href="./lab.html" title="Experiments: new versions of any chart, and the ones worth keeping">Lab</a>
        </nav>
        <details class="site-look-menu">
          <summary>Look</summary>
          <div class="site-look-panel"><div class="site-look-group" role="group" aria-label="Theme" data-look-key="theme"><span class="site-look-label" aria-hidden="true">Theme</span><button type="button" data-look-value="auto" aria-pressed="false">Auto</button><button type="button" data-look-value="light" aria-pressed="false">Light</button><button type="button" data-look-value="dark" aria-pressed="false">Dark</button></div><div class="site-look-group" role="group" aria-label="Style" data-look-key="preset"><span class="site-look-label" aria-hidden="true">Style</span><button type="button" data-look-value="glass" aria-pressed="false">Glass</button><button type="button" data-look-value="default" aria-pressed="false">Plain</button><button type="button" data-look-value="airy" aria-pressed="false">Airy</button><button type="button" data-look-value="paper" aria-pressed="false">Paper</button></div></div>
        </details>
      </div>
      <div class="board-tabs" role="tablist" aria-label="Dashboards" id="tabs"></div>
      <section id="panel" role="tabpanel" aria-labelledby="board-title">
        <header class="page">
          <h1 id="board-title">Dashboards</h1>
          <p id="board-intro">Four worked dashboards, each read top to bottom.</p>
        </header>
        <div id="board"></div>
      </section>
    </main>
    <script type="module" src="/demo/dashboards.ts"></script>
  </body>
</html>
