<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Editor · martcharts</title>
    <meta name="description" content="A chart from a table in four steps: drop or paste the data, describe the columns, pick and refine the chart with it live beside you, publish and embed it." />
    <link rel="stylesheet" href="/demo/site-nav.css" />
    <link rel="stylesheet" href="/demo/site-look.css" />
    <script src="/site-look.js"></script>
    <style>
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --line: rgba(11, 11, 11, 0.1);
        --field: #fcfcfb;
        --accent: #2a78d6;
        --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --page: #0d0d0d;
          --ink: #f0efec;
          --ink-2: #c3c2b7;
          --line: rgba(255, 255, 255, 0.1);
          --field: #1a1a19;
          --accent: #3987e5;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #0d0d0d;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --line: rgba(255, 255, 255, 0.1);
        --field: #1a1a19;
        --accent: #3987e5;
      }
      * { box-sizing: border-box; }
      /* Room for the scrollbar kept from the start, so loading a sample never shifts the page sideways. */
      html { scrollbar-gutter: stable; }
      body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow-x: clip; }
      main {
        max-width: 1280px; margin: 0 auto;
        padding: calc(13px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
          calc(64px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
      }
      a { color: inherit; }
      header.page { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 21px; }
      h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.022em; }
      p.lede { margin: 8px 0 0; color: var(--ink-2); max-width: 68ch; }
      .segmented { display: inline-flex; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; scrollbar-width: none; }
      .segmented::-webkit-scrollbar { display: none; }
      .segmented button { flex: none; white-space: nowrap; border: 0; background: transparent; color: var(--ink-2); padding: 5px 13px; font: inherit; font-size: 13px; cursor: pointer; min-height: 34px; }
      .segmented button[aria-pressed="true"] { background: var(--field); color: var(--ink); font-weight: 600; }
      .controls { display: flex; flex-wrap: wrap; gap: 13px; align-items: center; }
      .label { font-size: 13px; color: var(--ink-2); }
      :is(button, select, input, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      /* The editor itself wears the library's tokens; the page gives it room and the site's rhythm. */
      #editor { margin-top: 13px; }
      /* Edit JSON: the old playground's spec editor, folded until wanted. */
      .json-panel { margin: 0 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); }
      .json-panel summary { padding: 8px 13px; cursor: pointer; font-size: 14px; font-weight: 600; }
      .json-body { padding: 0 13px 13px; }
      .json-note { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
      .json-label { display: block; margin: 0 0 3px; font-size: 13px; color: var(--ink-2); }
      #json-text { width: 100%; min-height: 220px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); font: 12px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
      .json-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
      .json-tools button { min-height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--page); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
      .json-status { font-size: 13px; color: var(--ink-2); }
      .fft-editor { --fft-sticky-top: 13px; }
      @media (max-width: 760px) { h1 { font-size: 28px; } }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <div class="site-bar">
        <nav class="site-nav" aria-label="Pages">
          <a href="./index.html" title="What martcharts is, and where to start">Home</a>
          <a href="./dashboards.html" title="Four worked dashboards: sales, commercial, client health and regulatory">Dashboards</a>
          <a href="./editor.html" aria-current="page" title="A chart from a table, without writing JSON; or edit any chart's JSON directly">Editor</a>
          <a href="./composer.html" title="Lay saved charts out into a dashboard">Composer</a>
          <a href="./catalog/index.html" title="Every chart type, what it needs, and a spec to copy">Catalog</a>
          <a href="./examples/drop-in.html" title="Every way to put a chart on a page">Embed</a>
          <a href="./lab.html" title="Experiments: new versions of any chart, and the ones worth keeping">Lab</a>
        </nav>
        <details class="site-look-menu">
          <summary>Look</summary>
          <div class="site-look-panel"><div class="site-look-group" role="group" aria-label="Theme" data-look-key="theme"><span class="site-look-label" aria-hidden="true">Theme</span><button type="button" data-look-value="auto" aria-pressed="false">Auto</button><button type="button" data-look-value="light" aria-pressed="false">Light</button><button type="button" data-look-value="dark" aria-pressed="false">Dark</button></div><div class="site-look-group" role="group" aria-label="Style" data-look-key="preset"><span class="site-look-label" aria-hidden="true">Style</span><button type="button" data-look-value="glass" aria-pressed="false">Glass</button><button type="button" data-look-value="default" aria-pressed="false">Plain</button><button type="button" data-look-value="airy" aria-pressed="false">Airy</button><button type="button" data-look-value="paper" aria-pressed="false">Paper</button></div></div>
        </details>
      </div>
      <header class="page">
        <div>
          <h1>Editor</h1>
          <p class="lede">A chart from a table in four steps, with no JSON to write; or open the JSON and edit any chart directly.</p>
        </div>
      </header>
      <details class="json-panel" id="json-panel">
        <summary>Edit JSON</summary>
        <div class="json-body">
          <p class="json-note">Paste or edit a chart's spec. Apply draws it below, and the four steps take it from there.</p>
          <label class="json-label" for="json-text">Spec</label>
          <textarea id="json-text" spellcheck="false" rows="14"></textarea>
          <div class="json-tools">
            <button type="button" id="json-apply">Apply</button>
            <button type="button" id="json-reload">Show the current chart</button>
            <span class="json-status" id="json-status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </details>
      <div id="editor"></div>
    </main>
    <script type="module" src="/demo/editor.ts"></script>
  </body>
</html>
