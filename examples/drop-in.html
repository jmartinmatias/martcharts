<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed · martcharts</title>
  <!-- The whole library, with <fft-widget> registered. No bundler, no build step, no dependencies. -->
  <script src="../dist/martcharts-lite.iife.js"></script>
  <link rel="stylesheet" href="../demo/site-nav.css">
  <link rel="stylesheet" href="../demo/site-look.css">
  <script src="../site-look.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0 auto; max-width: 960px; padding: 24px 16px; background: Canvas; color: CanvasText; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    code { background: color-mix(in srgb, CanvasText 10%, transparent); padding: 1px 4px; border-radius: 3px; }
    header.page { margin: 8px 0 21px; }
    header.page h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; }
    header.page p { margin: 5px 0 0; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="site-bar">
    <nav class="site-nav" aria-label="Pages">
      <a href="../index.html" title="What martcharts is, and where to start">Home</a>
      <a href="../dashboards.html" title="Four worked dashboards: sales, commercial, client health and regulatory">Dashboards</a>
      <a href="../editor.html" title="A chart from a table, without writing JSON; or edit any chart's JSON directly">Editor</a>
      <a href="../composer.html" title="Lay saved charts out into a dashboard">Composer</a>
      <a href="../catalog/index.html" title="Every chart type, what it needs, and a spec to copy">Catalog</a>
      <a href="../examples/drop-in.html" aria-current="page" title="Every way to put a chart on a page">Embed</a>
      <a href="../lab.html" title="Experiments: new versions of any chart, and the ones worth keeping">Lab</a>
    </nav>
    <details class="site-look-menu">
      <summary>Look</summary>
      <div class="site-look-panel"><div class="site-look-group" role="group" aria-label="Theme" data-look-key="theme"><span class="site-look-label" aria-hidden="true">Theme</span><button type="button" data-look-value="auto" aria-pressed="false">Auto</button><button type="button" data-look-value="light" aria-pressed="false">Light</button><button type="button" data-look-value="dark" aria-pressed="false">Dark</button></div><div class="site-look-group" role="group" aria-label="Style" data-look-key="preset"><span class="site-look-label" aria-hidden="true">Style</span><button type="button" data-look-value="glass" aria-pressed="false">Glass</button><button type="button" data-look-value="default" aria-pressed="false">Plain</button><button type="button" data-look-value="airy" aria-pressed="false">Airy</button><button type="button" data-look-value="paper" aria-pressed="false">Paper</button></div></div>
    </details>
  </div>
  <header class="page">
    <h1>Embed a chart</h1>
    <p>Every way to put a chart on a page: each card below is one <code>&lt;fft-widget&gt;</code> tag and one script, with no build step.</p>
  </header>

  <div class="grid">
    <!-- 1. Spec written inside the tag. -->
    <fft-widget actions="csv image">
      <script type="application/json">
        {
          "title": "Signups by channel",
          "subtitle": "Last 30 days",
          "data": { "type": "inline", "rows": [
            { "channel": "Search", "signups": 1240 },
            { "channel": "Social", "signups": 860 },
            { "channel": "Referral", "signups": 610 },
            { "channel": "Email", "signups": 420 }
          ] },
          "fields": { "signups": { "label": "Signups", "format": "number" } },
          "view": { "type": "hbar", "label": "channel", "value": "signups" }
        }
      </script>
    </fft-widget>

    <!-- 2. Spec loaded from a JSON file (any widget in /widgets works). -->
    <fft-widget src="../widgets/revenue-kpi.json"></fft-widget>
    <fft-widget src="../widgets/revenue-by-region.json" actions="csv image copy"></fft-widget>

    <!-- 3. A CSV file, as exported from a spreadsheet: the first row names the fields. -->
    <fft-widget>
      <script type="application/json">
        {
          "title": "Tickets this week",
          "data": { "type": "csv", "url": "tickets.csv" },
          "view": { "type": "bar", "x": "team", "y": ["opened", "closed"] }
        }
      </script>
    </fft-widget>

    <!-- 4. No spec at all: point at a data file and the chart is picked from its shape. -->
    <fft-widget data="tickets.csv" heading="Tickets, chart picked from the data"></fft-widget>
    <fft-widget data="/data/monthly.json" heading="Monthly data, picked"></fft-widget>

    <!-- 5. Spec set from JavaScript, with live data. -->
    <fft-widget id="live"></fft-widget>
  </div>

  <script src="drop-in.js"></script>
</body>
</html>
