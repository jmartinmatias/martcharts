<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop-in widgets</title>
  <!-- The whole library, with <fft-widget> registered. No bundler, no build step, no dependencies. -->
  <script src="../dist/martcharts.iife.js"></script>
  <link rel="stylesheet" href="../demo/site-nav.css">
  <link rel="stylesheet" href="../demo/site-look.css">
  <script src="../site-look.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 24px 16px; background: Canvas; color: CanvasText; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    code { background: color-mix(in srgb, CanvasText 10%, transparent); padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Pages">
    <a href="../index.html" title="Every widget in the library, each the same component fed a different spec">Gallery</a>
    <a href="../taller.html" title="elBulli's creative method applied to sales charts: new versions of any widget, each answering a sales question">Taller</a>
    <a href="../selected.html" title="New ways to show the same data, picked because they are new and meaningful">Selected</a>
    <a href="../index.html#playground" title="Edit any widget's spec, view and style, with a live preview">Playground</a>
    <a href="../editor.html" title="A chart from a table in four steps: drop the data, describe the columns, pick and refine the chart, publish and embed">Editor</a>
    <a href="../commercial.html" title="The commercial cockpit: products, coverage, sales, campaigns, adoption, whitespace, clients and anomalies on one page">Commercial</a>
    <a href="../catalog/index.html" title="Every chart type: what data it needs, when to use it, and a spec to copy">Catalog</a>
    <a href="../catalog/guide.html" title="What each chart needs, row by row, the data drawing it, when to use it, and which other charts the same data makes">Data guide</a>
    <a href="../examples/drop-in.html" aria-current="page" title="Every way to put a chart on a page: one tag, a JSON file, a CSV, or just a data address">Drop-in</a>
  </nav>
  <h1>Drop-in widgets</h1>
  <p>Built with <code>npm run build:lib</code>. Each card below is one tag. Serve this folder from the repo root (for example <code>npm run dev</code>, then open <code>/examples/drop-in.html</code>).</p>

  <div class="grid">
    <!-- 1. Spec written inside the tag. -->
    <fft-widget actions="csv image">
      <script type="application/json">
        {
          "title": "Signups by channel",
          "subtitle": "Last 30 days",
          "data": { "type": "inline", "rows": [
            { "channel": "Search", "signups": 1240 },
            { "channel": "Social", "signups": 860 },
            { "channel": "Referral", "signups": 610 },
            { "channel": "Email", "signups": 420 }
          ] },
          "fields": { "signups": { "label": "Signups", "format": "number" } },
          "view": { "type": "hbar", "label": "channel", "value": "signups" }
        }
      </script>
    </fft-widget>

    <!-- 2. Spec loaded from a JSON file (any widget in /widgets works). -->
    <fft-widget src="../widgets/revenue-kpi.json"></fft-widget>
    <fft-widget src="../widgets/revenue-by-region.json" actions="csv image copy"></fft-widget>

    <!-- 3. A CSV file, as exported from a spreadsheet: the first row names the fields. -->
    <fft-widget>
      <script type="application/json">
        {
          "title": "Tickets this week",
          "data": { "type": "csv", "url": "tickets.csv" },
          "view": { "type": "bar", "x": "team", "y": ["opened", "closed"] }
        }
      </script>
    </fft-widget>

    <!-- 4. No spec at all: point at a data file and the chart is picked from its shape. -->
    <fft-widget data="tickets.csv" heading="Tickets, chart picked from the data"></fft-widget>
    <fft-widget data="/data/monthly.json" heading="Monthly data, picked"></fft-widget>

    <!-- 5. Spec set from JavaScript, with live data. -->
    <fft-widget id="live"></fft-widget>
  </div>

  <script>
    const el = document.getElementById("live");
    el.spec = {
      title: "Requests per minute",
      data: { type: "fn", load: () => Array.from({ length: 12 }, (_, i) => ({ minute: `12:${String(i * 5).padStart(2, "0")}`, requests: 200 + Math.round(80 * Math.sin(i / 2)) })) },
      view: { type: "line", x: "minute", y: "requests" },
    };
    document.addEventListener("fft-select", (event) => console.log("selected", event.detail.row));
  </script>
</body>
</html>
